# <!-- squad-heroes:workflow:heroes-ci:begin -->
name: Heroes consumer CI

on:
  push:
    branches: {{branches}}
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build --if-present
# <!-- squad-heroes:workflow:heroes-ci:end -->
