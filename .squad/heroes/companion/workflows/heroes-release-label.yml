# <!-- squad-heroes:workflow:heroes-release-label:begin -->
name: Heroes release label

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check immutable release gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_TAG_PREFIX: ${{ vars.HEROES_RELEASE_TAG_PREFIX }}
        run: node scripts/check-release-label.mjs
# <!-- squad-heroes:workflow:heroes-release-label:end -->
